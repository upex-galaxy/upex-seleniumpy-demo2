name: 🤖CI run SanityTest Execution🧪
run-name: ${{github.actor}}👨🏻‍🔬 ran SanityTest in ${{github.ref_name}}

on:
  workflow_dispatch:
    inputs:
      test:
        description: '🧪Test File to Run'
        required: true
        default: test_GX3_4595_Textbox.py
        type: choice
        options:
        - test_GX3_4595_Textbox.py
        - test_GX3-3854_Dropdpwn.py
        - test_GX3-4644_PracticeForm.py
        - test_GX3-4652_Elements.py
        - test_GX3-4660_Elements_Checkbox.py
        - test_GX3-4668_Elements_Buttons.py

jobs:
  SanityTest:
    runs-on: ubuntu-latest

    steps:
    - name: 💻 Clone Repository
      uses: actions/checkout@v4

    - name: 💿 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.5'

    - name: 🧬Install all DevDependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧪Selenium Run Pytest
      run: pytest --headless=true tests/ToolsQA_ByZulemaArteaga/${{github.event.inputs.test}}
